<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>القائمة وحساباتنا</title>
<meta name="description" content="القائمة الإلكترونية، ساعات العمل، الموقع، وحساباتنا على مواقع التواصل">
<meta name="theme-color" content="#1c1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1410;--surface:#2a1f18;--surface-hover:#35271e;
  --text:#f8efe3;--muted:#bfae9b;--accent:#e9b44c;--accent-ink:#1c1410;
  --ok:#7bd88f;--closed:#ff8a7a;--radius:18px;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:var(--bg);color:var(--text);display:flex;justify-content:center;
  padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));
}
main{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
header{text-align:center;padding:8px 0 0}
.logo{
  width:96px;height:96px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-ink);font-size:42px;font-weight:800;
}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover}
h1{font-size:28px;font-weight:800;line-height:1.3;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:default}
header p{color:var(--muted);margin-top:6px;font-size:16px}

.socials{display:flex;justify-content:center;gap:14px}
.soc{
  width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);color:var(--text);text-decoration:none;
  transition:background .2s,transform .2s;
}
.soc svg{width:26px;height:26px;fill:currentColor}
.soc:hover{background:var(--surface-hover)}
.soc:active{transform:scale(.94)}

.status{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:8px 14px;border-radius:999px;background:var(--surface);font-size:15px;font-weight:600;
}
.status::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.open::before{background:var(--ok)}
.status.closed::before{background:var(--closed)}

.link,.act,.soc{border:0;font:inherit;cursor:pointer}
.link,.act{
  display:flex;align-items:center;gap:16px;background:var(--surface);color:var(--text);
  border-radius:var(--radius);text-decoration:none;font-weight:600;transition:background .2s,transform .2s;
}
.link:hover,.act:hover{background:var(--surface-hover)}
.link:active,.act:active{transform:scale(.98)}
.link:focus-visible,.act:focus-visible,.soc:focus-visible,summary:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.link{min-height:64px;padding:14px 18px;font-size:18px;width:100%}
.link svg,.act svg{width:28px;height:28px;flex:none;fill:currentColor}
.link span{flex:1}
.arrow{width:20px;height:20px;flex:none;color:var(--muted);transform:scaleX(-1)}
.link.menu{background:var(--accent);color:var(--accent-ink);min-height:76px;font-size:21px;font-weight:800}
.link.menu:hover{background:#f0c264}
.link.menu .arrow{color:var(--accent-ink)}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}
.act{flex-direction:column;justify-content:center;gap:6px;min-height:82px;padding:12px 8px;font-size:15px;text-align:center}
.act.wide{flex-direction:row;justify-content:center;min-height:56px;font-size:17px}

.card{background:var(--surface);border-radius:var(--radius);padding:16px 18px}
.wifi{display:flex;align-items:center;gap:14px}
.wifi svg{width:28px;height:28px;fill:currentColor;flex:none}
.wifi div{flex:1;min-width:0}
.wifi small{display:block;color:var(--muted);font-size:14px}
.wifi b{display:block;font-size:17px;overflow-wrap:anywhere}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;min-height:44px}

details.card summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px;min-height:32px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:24px;color:var(--muted);line-height:1}
details[open].card summary::after{content:"−"}
.hours{margin-top:12px;display:flex;flex-direction:column}
.hours div{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #3d2e23;font-size:16px}
.hours div.today{color:var(--accent);font-weight:800}

footer{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.toast{
  position:fixed;inset-inline:0;bottom:max(24px,env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:90%;
  background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;
  opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:none}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.link,.act,.soc,.toast{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" id="logo" aria-hidden="true"></div>
    <h1 id="name">اسم المطعم</h1>
    <p id="tagline" hidden></p>
  </header>

  <nav class="socials" id="social" aria-label="مواقع التواصل الاجتماعي" hidden></nav>
  <nav id="menuWrap" aria-label="القائمة" hidden></nav>
  <div class="status" id="status" role="status" hidden></div>
  <div class="quick" id="quick" hidden></div>

  <div class="card wifi" id="wifi" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    <div><small>شبكة الواي فاي</small><b id="wifiName"></b></div>
    <button class="btn" id="wifiCopy" type="button">نسخ كلمة المرور</button>
  </div>

  <details class="card" id="hoursBox" hidden>
    <summary>ساعات العمل</summary>
    <div class="hours" id="hours"></div>
  </details>

  <button class="act wide" id="share" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
    مشاركة الصفحة
  </button>

  <footer id="footer"></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
